name = "crucible"
main = "src/index.js"
compatibility_date = "2025-05-01"
# Required so the Anthropic SDK's Node-style imports resolve inside the Worker.
compatibility_flags = ["nodejs_compat"]

# Serve only via the custom domain; disable the *.workers.dev URL.
workers_dev = false

# Custom domain — Cloudflare provisions DNS + TLS automatically (zone must be on
# this account). The *.workers.dev URL keeps working alongside it.
routes = [
  { pattern = "crucible.clydeford.net", custom_domain = true }
]

# Static GUI (HTML/JS/CSS) is served from ./public via the assets binding.
# The Worker only handles /api/* routes; everything else is a static asset.
[assets]
directory = "./public"
binding = "ASSETS"

# The Anthropic API key is NOT stored here. Set it as a secret:
#   npx wrangler secret put ANTHROPIC_API_KEY

# /api/harden abuse controls (src/index.js):
# - Origin allowlist: the app's own origin (derived from the request URL) is
#   always allowed. Optionally extend it with a comma-separated list here if
#   the Worker is ever fronted under an additional origin, e.g.:
#   [vars]
#   ALLOWED_ORIGIN = "https://crucible.clydeford.net,https://staging.example.com"
# - Rate limiting: no Cloudflare Rate Limiting binding
#   ([[unsafe.bindings]] type = "ratelimit") or KV namespace is configured,
#   so /api/harden falls back to an in-isolate, per-IP in-memory limiter.
#   That is a best-effort approximation PER WORKER ISOLATE, not a global
#   limit across edge locations — see the comment above checkRateLimit() in
#   src/index.js. Add a Rate Limiting binding here for a real global limit.
# - Body-size cap + summary validation: MAX_BODY_BYTES (32 KB request body)
#   and MAX_SUMMARY_JSON_BYTES (16 KB re-serialized `summary`) in
#   src/index.js reject oversized/malformed payloads with 413/400 before
#   any Anthropic call.
